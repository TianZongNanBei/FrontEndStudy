<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 首先定义了一个 TreeNode 类来表示树的节点，每个节点包含一个值和一个子节点数组。
      // 对于广度优先搜索（bfs 函数），使用一个队列来存储待访问的节点，每次从队列中取出一个节点，访问其值，并将其所有子节点加入队列，直到队列为空。

      // 定义树节点类
      class TreeNode {
        constructor(val) {
          this.val = val;
          this.children = [];
        }
      }

      // 广度优先搜索函数
      function bfs(root) {
        if (!root) return [];
        const result = [];
        const queue = [root];

        while (queue.length > 0) {
          const node = queue.shift();
          result.push(node.val);
          queue.push(...node.children);
        }
        return result;
      }

      // 创建一个简单的树结构
      const root = new TreeNode(1);
      const node2 = new TreeNode(2);
      const node3 = new TreeNode(3);
      const node4 = new TreeNode(4);
      const node5 = new TreeNode(5);

      root.children = [node2, node3];
      node2.children = [node4, node5];

      // 执行广度优先搜索
      const bfsResult = bfs(root);
      console.log(bfsResult); // 输出: [1, 2, 3, 4, 5]
    </script>
  </body>
</html>
